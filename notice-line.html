<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#fff;overflow:hidden}
  #t{width:100%;height:34px;line-height:34px;text-align:center;white-space:nowrap;
     font-family:-apple-system,HelveticaNeue,"Helvetica Neue",helvetica,AppleSDGothicNeo,arial,"malgun gothic","맑은 고딕",sans-serif;
     font-size:19px;font-weight:700;color:#FF0010;}
</style></head><body>
<div id="t">계산 중...</div>
<script>
  // 한국시간 기준. 0~11시 -> 당일 11:59 / 12~23시 -> 당일 23:59
  var k = new Date(Date.now() + 9*3600*1000);
  var m = k.getUTCMonth()+1, d = k.getUTCDate(), h = k.getUTCHours();
  var t = (h < 12) ? '11:59' : '23:59';
  document.getElementById('t').textContent = m + '월 ' + d + '일 ' + t + ' 이후로는';
</script>
</body></html>
