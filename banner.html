<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#fff; font-family:'Pretendard', sans-serif; -webkit-font-smoothing:antialiased; }
  #banner { position:relative; width:848px; background:#fff; }
  .head { position:relative; width:848px; height:368.7px; background:#fff; }
  .l { position:absolute; left:0; width:100%; text-align:center; white-space:nowrap; line-height:1; }
  .l1 { top:110.6px; font-size:57.5px; font-weight:900; color:#000;    transform:scaleX(1.031); }
  .l2 { top:187.6px; font-size:75.9px; font-weight:900; color:#000;    transform:scaleX(1.070); }
  .l3 { top:293.3px; font-size:37.4px; font-weight:800; color:#EF0000; transform:scaleX(0.981); }
  .card { display:block; width:848px; }
</style>
</head>
<body>
  <div id="banner">
    <div class="head">
      <div class="l l1">단 일주일!</div>
      <div class="l l2">7차 완판 기념 이벤트</div>
      <div class="l l3" id="dateLine">계산 중...</div>
    </div>
    <img class="card" src="card.png" alt="">
  </div>
  <script>
    var today = new Date();
    var start = new Date(today.getTime());
    start.setDate(today.getDate() - 6);
    function fmt(d) { return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
    document.getElementById('dateLine').textContent = fmt(start) + ' ~ ' + fmt(today) + ', 재고 소진 시 조기 종료';
  </script>
</body>
</html>
